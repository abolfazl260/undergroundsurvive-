name: Capacitor Android checks

# Android CI is opt-in only. Web checks and deployment remain automatic elsewhere.
on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload an Android debug APK as well as running checks"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-capacitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-bundle:
    name: Web bundle and Capacitor config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify web game and mobile config unit tests
        run: |
          npm test
          npm run mobile:test
      - name: Build and inspect offline bundle
        run: |
          npm run build
          npm run mobile:check

  android-debug:
    name: Android debug APK
    needs: web-bundle
    if: ${{ inputs.build_apk == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # GitHub's Ubuntu runner includes Android SDK command-line tools.
      # Avoid setup-android@v3: its default legacy "tools" package no longer exists.
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android command-line tools not found in $SDK_ROOT"
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate and sync Android shell
        run: npm run mobile:prepare:android
      - name: Compile development APK (not store-signed)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: game/android
      - uses: actions/upload-artifact@v4
        with:
          name: underground-survive-android-debug
          path: game/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
