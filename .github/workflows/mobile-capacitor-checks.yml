name: Capacitor Android checks

on:
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload an Android debug APK as well as running checks"
        required: false
        type: boolean
        default: false
      run_extended_quality:
        description: Run extended integration, soak and real mobile-touch browser tests
        required: true
        type: boolean
        default: true
      strict_reproducibility:
        description: Require committed lockfile and matching output from two clean builds
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-capacitor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-bundle:
    name: Web bundle and Capacitor config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          # npm sometimes omits the Linux Rollup optional native package on fresh runners.
          npm install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")"
      - name: Verify web game and mobile config unit tests
        run: |
          npm test
          npm run mobile:test
      - name: Build and inspect offline bundle
        run: |
          npm run build
          npm run mobile:check
      - name: Manual integration and simulated long-run tests
        if: ${{ inputs.run_extended_quality }}
        env:
          GAME_SOAK_HOURS: '4'
        run: |
          npm run quality:integration
          npm run quality:soak
      - name: Manual mobile touch and corrupted-save scenarios
        if: ${{ inputs.run_extended_quality }}
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          npm run preview -- --port 4173 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [[ "$ready" -ne 1 ]]; then echo "::error::Preview server failed"; exit 1; fi
          npm run quality:browser
      - name: Optional strict clean-build reproducibility verification
        if: ${{ inputs.strict_reproducibility }}
        run: npm run quality:repro
      - name: Upload manual Android QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-android-debug-quality-${{ github.run_number }}
          path: game/quality-evidence/
          if-no-files-found: ignore
          retention-days: 14

  android-debug:
    name: Android debug APK
    needs: web-bundle
    if: ${{ inputs.build_apk == true }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # GitHub's Ubuntu runner includes Android SDK command-line tools.
      # Avoid setup-android@v3: its default legacy "tools" package no longer exists.
      - name: Install Android SDK platform
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android command-line tools not found in $SDK_ROOT"
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          # npm sometimes omits the Linux Rollup optional native package on fresh runners.
          npm install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")"
      - name: Generate and sync Android shell
        run: npm run mobile:prepare:android
      - name: Compile development APK (not store-signed)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: game/android
      - uses: actions/upload-artifact@v4
        with:
          name: underground-survive-android-debug
          path: game/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
