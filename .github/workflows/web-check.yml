name: Web prototype checks

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/web-check.yml"
  pull_request:
    paths:
      - "game/**"
      - ".github/workflows/web-check.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          # npm sometimes omits the Linux Rollup optional native package on fresh runners.
          npm install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$(node -p "require('./node_modules/rollup/package.json').version")"
      - name: Unit tests
        run: npm test
      - name: Validate independent achievement images
        run: node scripts/check-achievement-webp.mjs
      - name: Typecheck and build
        run: npm run build

