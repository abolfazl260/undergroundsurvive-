name: Materialize independent achievement WebP images

on:
  push:
    branches: [feature/achievement-webp-optimized]
    paths:
      - 'game/scripts/prepare-achievement-webp.py'
      - '.github/workflows/materialize-achievement-webp.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic artwork tool
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Produce 11 separate images at two widths
        run: python game/scripts/prepare-achievement-webp.py
      - name: Move shared original out of published assets
        run: |
          mkdir -p game/artwork-sources
          if [ -f game/public/assets/achievements/milestone-scenes-hd.webp ]; then
            mv game/public/assets/achievements/milestone-scenes-hd.webp game/artwork-sources/milestone-scenes-hd.webp
          fi
      - name: Commit converted assets to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A game/public/assets/achievements/ game/artwork-sources/
          if ! git diff --cached --quiet; then
            git commit -m 'assets(achievements): commit 22 independently loaded optimized WebPs'
            git push origin HEAD:refs/heads/feature/achievement-webp-optimized
          fi
